        Fallback prover, used on individual goals rather than as a primary
        source of proofs: submitted self-contained Lean files to close specific
        `sorry`s where the ChatGPT and Claude Code sessions had not succeeded.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based and not tracked"
        hardware: "local workstation and hosted services"
      prompting_notes: >-
        Per-goal submission of self-contained files, with the returned proof
        terms rechecked in the repository build.
    - method: "other"
      models: []
      framework: "Python scripts in scripts/"
      tool_setup: >-
        `scripts/check_boundary_cases.py` independently re-implements the
        finite-field arithmetic and the boundary computations, and checks them
        against the same case list as the executable Lean audits in
        `KasamiCyclicAdditive/Validation/BoundaryComputations.lean`. It uses
