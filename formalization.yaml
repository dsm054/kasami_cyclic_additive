        and a disagreement between the two implementations indicates a bug in
        one of them rather than a gap in the proof.

  spend_usd: "subscription-based across all methods"
  notes: >-
    The formal proof was developed collaboratively with AI systems under human
    direction; all final proof terms are checked by Lean. The Palomar port
    follows the official Challenge/Solution and Comparator conventions.

fidelity:
  divergences: >-
    No known mathematical divergence from the exact coefficient-form conjecture.
    The Challenge statement imposes neither the proof normalization k < n nor
    separate hypotheses 1 <= k or 2 <= n. ParameterReduction proves that
    |K|=2^n together with distinct nonzero coefficients forces n >= 2; then
    gcd(k,n)=1 makes k % n a positive representative below n. The derivative
    image and coefficient triple count are proved invariant under k -> k % n,
    and KasamiCyclicAdditive.carlet_kasami_cyclic_additive_literature reduces
    the exact statement to the normalized core theorem. The Lean statement works
    over an arbitrary finite field K equipped with CharP K 2 and a cardinality
    witness |K|=2^n, rather than choosing a concrete model of GF(2^n); this is
    mathematically equivalent.

review:
  status: "agent-reviewed"
  reviewers:
    - "Aristotle (Harmonic)"
  notes: >-
    The formal development has undergone repeated statement, dependency, and
    axiom audits and successful Lean builds. An independently structured,
    Mathlib-only literature specification and a formal semantic bridge to the
    implementation are included. An independent Aristotle review rechecked
    statement fidelity and Challenge/Solution correspondence and successfully
    replayed the real Landrun Comparator; Comparator, NanoDa, and the Lean kernel
    accepted the solution using only the three permitted axioms. The
    Comparator-facing Solution environment imports only KasamiCyclicAdditive.Main,
    excluding Validation computations from that environment.

alignment:
  namespace: "KasamiCyclicAdditive"
  statements:
    - source: "Carlet (2018), Proposition 4.11 and Definition 4.12, specialized to Kasami exponents"
      lean: "KasamiCyclicAdditive.carlet_kasami_cyclic_additive"
      module: "Challenge"
      status: "formalized and proved"
      note: >-
        Exact coefficient triple-count form with distinct nonzero v1,v2 and
        coefficient v1+v2 on the third variable. The property formalized is
        Definition 4.12, which Carlet states for any set of size 2^(n-1) and
        which carries no parity hypothesis. Proposition 4.11 names the same
        condition but identifies it with componentwise Walsh uniformity only
        for an APN permutation, hence only for odd n.

