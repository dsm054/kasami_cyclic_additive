    - method: "agent"
      models:
        - "Claude Opus 5 (Anthropic)"
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Lean development, build-error repair, code review, and formalization
        auditing, including the boundary-case and executable audits and the
        independent Python oracle. Together with ChatGPT this accounted for the
        bulk of the development.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based and not tracked"
        hardware: "local workstation and hosted services"
      prompting_notes: >-
        Interactive sessions under human direction, with the Lean build and the
