      framework: "Codex (OpenAI)"
      tool_setup: >-
        Agentic Lean development in the repository: formalization of the
        argument, refactoring, and documentation.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based and not tracked"
        hardware: "local workstation and hosted services"
      prompting_notes: >-
        Repository-level agent sessions, with the Lean build run on each
